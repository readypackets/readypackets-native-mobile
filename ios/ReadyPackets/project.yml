name: ReadyPackets
options:
  bundleIdPrefix: com.readypackets
  deploymentTarget:
    iOS: "17.0"
targets:
  ReadyPackets:
    type: application
    platform: iOS
    sources:
      - path: ReadyPacketsApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.readypackets.mobile
        INFOPLIST_FILE: ReadyPacketsApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: ReadyPacketsApp/ReadyPackets.entitlements
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PORTAL_BASE_URL: "https://portal.example.com"
        OAUTH_REDIRECT_URI: "https://mobile.example.com/auth/callback"
  ReadyPacketsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReadyPacketsTests
    dependencies:
      - target: ReadyPackets
